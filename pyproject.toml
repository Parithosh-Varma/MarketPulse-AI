[project]
name = "marketpulse-ai"
version = "0.2.0"
description = "MarketPulse AI — financial market intelligence & sentiment research platform (evolution of FinSentinel)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "notebooks", "scripts", "pipeline"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
